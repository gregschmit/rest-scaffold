<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REST Scaffold Test App</title>
    <script>
      window._kitchen_sink_conf = {
        target: "/api/paged/users",
        pagination: { pageSize: [5, 2, 10, 20, 50] },
        autoRefreshSeconds: 4,
        sortable: true,
        listFields: ["id", "login", "name", "active", "is_staff", "next_exam", "risk_score", "balance", "ev"],
        fieldConfig: {
          id: { label: "ID" },
          login: { label: "Login" },
          name: { label: "Name" },
          active: { label: "Active", type: "boolean", format: { style: "badge" } },
          is_staff: { label: "Is Staff", type: "boolean", format: { style: "badge" } },
          lucky_number: { label: "Lucky Number", type: "integer" },
          birth_date: { label: "Birth Date", type: "date" },
          birth_time: { label: "Birth Time", type: "time" },
          next_exam: { label: "Next Exam", type: "datetime" },
          risk_score: { label: "Risk Score", type: "number" },
          balance: {
            label: "Balance",
            type: "decimal",
            inputOptions: { step: 0.01, min: 0 },
            format: { style: "currency", currency: "USD" },
          },
          ev: {
            label: "EV",
            type: "virtual",
            render: (record, { config }) => {
              return config.formatNumber(
                record.balance * (record.risk_score / 10000),
                { numberFormat: { maximumFractionDigits: 2 } },
              )
            },
          },
          created_at: { label: "Created At", type: "datetime", readonly: true },
        },
        // canShow: false,
        // canDelete: false,
        help: "This is a test scaffold of <strong>users</strong>.",
      }
    </script>
    <style>
      .wrapper {
        display: flex;
      }
      .left,
      .right {
        min-height: 50px;
        min-width: 50px;
      }
      .left {
        width: 95%;
        overflow-x: auto;
        resize: horizontal;
        border: 2px dashed #f0f;
      }
      .right {
        flex: 1;
        border: 2px dashed #00f;
      }
    </style>
  </head>
  <body>
    <h1>REST Scaffold Test App</h1>
    <ul>
      <li>Home</li>
      <li><a href="/iife.html">IIFE</a></li>
    </ul>
    <hr />

    <div style="width: 100%; padding: 0 10em"></div>

    <h2>Kitchen Sink Light Mode:</h2>
    <div class="wrapper" style="background-color: #a2c1f5">
      <div class="left">
        <div id="usersScaffold">
          <script type="module">
            import RESTScaffold from "./dist/rest-scaffold.js"
            RESTScaffold.mount("#usersScaffold", window._kitchen_sink_conf)
          </script>
        </div>
      </div>
      <div class="right"></div>
    </div>

    <hr />

    <h2>Kitchen Sink Dark Mode:</h2>
    <div class="wrapper" style="background-color: #444; color-scheme: dark">
      <div class="left">
        <div id="darkUsersScaffold">
          <script type="module">
            import RESTScaffold from "./dist/rest-scaffold.js"
            RESTScaffold.mount("#darkUsersScaffold", window._kitchen_sink_conf)
          </script>
        </div>
      </div>
      <div class="right"></div>
    </div>
  </body>
</html>
